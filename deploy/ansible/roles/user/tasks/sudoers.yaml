# Task list to enable sudo w/o password for sudo group

---
# Write a config line in sudoers.d/sudo to enable sudo w/o password for sudo members
- name: Configure sudoers.d/sudo
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/sudo
    line: '%sudo	ALL=(ALL) NOPASSWD: ALL'
    state: present
    create: yes
    mode: u=r,g=r,o-rwx
    owner: root
    group: root
    validate: /usr/sbin/visudo -cf %s
  vars:
    ansible_ssh_user: "{{ provided_user }}"
    ansible_ssh_pass: "{{ provided_pass }}"
    # Connect with user/pass auth
    ansible_ssh_common_args: "-o PubkeyAuthentication={{ ssh_pubkey_authentication | default('no') }}"
  become: true