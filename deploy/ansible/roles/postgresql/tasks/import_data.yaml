---

# 1. Create directory
- name: Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: ansible
    group: docker
    mode: u+rw,g+rw,o-rwx
  with_items:
    - "{{ pg_import_data }}"
  become: true

# 2. Deliver
- name: Deliver dumps
  ansible.builtin.copy:
    remote_src: false
    src: "{{ item }}"
    dest: "{{ pg_import_data }}/{{ item }}"
    force: true
    owner: ansible
    group: docker
    mode: u=rw,g=rw,o=r
  with_items:
    - "cms.dump"
    - "filestorage.dump"
    - "lists.dump"

