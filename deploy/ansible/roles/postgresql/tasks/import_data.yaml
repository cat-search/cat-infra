- name: pg_restore
  ansible.builtin.shell: > 
    docker exec -ti {{ pg_container_name }} 
    /bin/bash -c
    'pg_restore --create
    -U {{ pg_user }}
    --dbname postgres 
    --no-owner --format c --no-privileges {{ item.file }}'
  with_items:
    - { db: cms, file: "/opt/catsearch/import_data/cms.dump" }
    - { db: filestorage, file: "/opt/catsearch/import_data/filestorage.dump" }
    - { db: lists, file: "/opt/catsearch/import_data/lists.dump" }
  register: pg_restore_result

# 4.2. Docker run: print
- name: "pg_restore: print"
  ansible.builtin.debug:
    var: pg_restore_result
  when: pg_restore_result is defined
