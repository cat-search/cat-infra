[defaults]
interpreter_python: auto_silent
#ansible_python_interpreter:
# Stdout callback plugin. For pretty errors/traceback.
#   https://docs.ansible.com/ansible/latest/collections/callback_index_stdout.html
stdout_callback = yaml
# Use stdout_callback for ad-hoc commands
bin_ansible_callbacks = True
executable = /bin/bash
inventory = inventory
# Silence warnings, var: ANSIBLE_ACTION_WARNINGS
# action_warnings = false

[ssh_connection]
ssh_args = -F ssh.cfg
